[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlctl"
version = "0.1.0"
description = "CLI unificado de migração Bronze->Silver->Gold->Fabric para o ecossistema Constellation, com dashboard de controle."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "msal>=1.28.0",
    "nbformat>=5.10.4",
    "pandas>=2.2.2",
    "sqlmodel>=0.0.21",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.5",
    "networkx>=3.2",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.2.1", "zeep>=4.2.1"]
dashboard = ["streamlit>=1.36.0", "plotly>=5.22.0", "streamlit-aggrid>=1.0.5", "networkx>=3.2", "openpyxl>=3.1.5"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0"]

[project.scripts]
dlctl = "dlctl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
